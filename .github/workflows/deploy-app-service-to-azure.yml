name: Deploy Copilot Python Backend to Azure App Service

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Container Registry Login
        uses: Azure/docker-login@v1
        with:
          # Container registry server url
          login-server: ${{ secrets.DOCKER_REGISTRY_SERVER_URL }}
          # Container registry username
          username: ${{ secrets.DOCKER_REGISTRY_SERVER_USERNAME }}
          # Container registry password
          password: ${{ secrets.DOCKER_REGISTRY_SERVER_PASSWORD }}
  
  production:
    runs-on: ubuntu-latest
  
    needs: build
    environment: prod 
    name: Pull and Deploy Prod App Service
    steps:
      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'test2CopilotFastAPi'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'test2datoxcopilotsite.azurecr.io/test2datoxcopilotsite:v2'