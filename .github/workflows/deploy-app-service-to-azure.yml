name: Deploy Copilot Python Backend to Azure App Service Action

on:
    push:
      branches: [ feature/deploy-acr-to-app-service ]
    pull_request:
      branches: [ feature/deploy-acr-to-app-service ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push the Docker image to ACR
    
    steps:
      - uses: actions/checkout@v3

      - name: Azure Container Registry Login
        uses: Azure/docker-login@v1
        with:
          login-server: ${{ secrets.DOCKER_REGISTRY_SERVER_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_SERVER_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_SERVER_PASSWORD }}
      
      - name: Build and Push the Docker image to ACR
        run: |
            docker build . \ 
              --build-arg DATOX_DATABASE__MAIN_DSN=${{ secrets.DATOX_DATABASE__MAIN_DSN }} 
              --build-arg DATOX_DATABASE__ADMIN_DSN=${{ secrets.DATOX_DATABASE__ADMIN_DSN }}
              --build-arg ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }} 
              -t ${{ secrets.DOCKER_REGISTRY_SERVER_URL }}/test2datoxcopilotsite:${{ github.run_id }}
            docker push ${{ secrets.DOCKER_REGISTRY_SERVER_URL }}/test2datoxcopilotsite:${{ github.run_id }}          
  
  production:
    runs-on: ubuntu-latest
  
    needs: build
    environment: prod 
    name: Pull and Deploy Prod App Service
    steps:
      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'test2CopilotFastAPi'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKER_REGISTRY_SERVER_URL }}/test2datoxcopilotsite:${{ github.run_id }}'